<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Data Encryption</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <img src="./static/download.png" class="card-img-top" alt="Weather Image">
                    <div class="card-body">
                        <h5 class="card-title">Weather Data</h5>
                        <p class="card-text">A simple temperature and humidity card.</p>
                        <form action="/post_data" method="post">
                            <div class="mb-3">
                                <label for="frequency" class="form-label">Frequency</label>
                                <textarea id="frequency" name="frequency" class="form-control" placeholder="Enter frequency of data" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="interval" class="form-label">Interval (in seconds)</label>
                                <textarea id="interval" name="interval" class="form-control" placeholder="Enter intervals (in seconds)" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Post Data</button>
                            </div>
                        </form>
                    </div>
                    <form action="/encrypt" method="post" class="p-3">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Encrypt Data</button>
                        </div>
                    </form>
                    <form action="/decrypt" method="post" class="p-3">
                        <div class="mb-3">
                            <label for="decrypt-password" class="form-label">Password</label>
                            <input type="password" id="decrypt-password" name="password" class="form-control" placeholder="Enter password to decrypt" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Decrypt Data</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                {% if data %}
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Data Output</h5>
                        <pre class="alert alert-info">{{ data }}</pre>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="frontend/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
